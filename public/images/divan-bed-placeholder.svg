<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Spring Pal Divan Bed and Mattress placeholder image">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="headboard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="mattress" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)" rx="16" />

  <!-- Subtle room accent lines -->
  <line x1="60" y1="392" x2="740" y2="392" stroke="#CBD5E1" stroke-width="2" />

  <!-- Upholstered Headboard -->
  <rect x="170" y="105" width="460" height="165" rx="18" fill="url(#headboard)" />
  <rect x="186" y="121" width="428" height="133" rx="12" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Pillows -->
  <rect x="215" y="185" width="165" height="62" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  <rect x="420" y="185" width="165" height="62" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />

  <!-- Spring Mattress Layer -->
  <rect x="145" y="242" width="510" height="68" rx="14" fill="url(#mattress)" stroke="#94A3B8" stroke-width="2.5" />
  <line x1="165" y1="276" x2="635" y2="276" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="8 8" />

  <!-- Upholstered Divan Base -->
  <rect x="140" y="308" width="520" height="64" rx="10" fill="#1E293B" />
  <line x1="400" y1="308" x2="400" y2="372" stroke="#334155" stroke-width="2" />

  <!-- Divan Legs -->
  <rect x="165" y="372" width="22" height="20" rx="4" fill="#0F172A" />
  <rect x="613" y="372" width="22" height="20" rx="4" fill="#0F172A" />

  <!-- Clearly Labeled Placeholder Badge -->
  <rect x="200" y="416" width="400" height="44" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <text x="400" y="443" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#475569">
    DIVAN BED + MATTRESS • OFFICIAL IMAGE PLACEHOLDER
  </text>
</svg>
